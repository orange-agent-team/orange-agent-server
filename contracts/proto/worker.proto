syntax = "proto3";
package orange.worker.v1;
import "google/protobuf/timestamp.proto";

// Transport peer identity comes from mTLS, never from node_id alone.
service WorkerGateway { rpc Control(stream WorkerFrame) returns (stream ServerFrame); rpc ReadInput(InputReadRequest) returns (InputReadReply); rpc RenewExecution(ExecutionRenewalRequest) returns (ExecutionRenewalReply); }
message Lease {
  string lease_id = 1;
  string job_id = 2;
  string attempt_id = 3;
  uint64 connection_epoch = 4;
  uint64 fencing_token = 5;
  google.protobuf.Timestamp expires_at = 6;
}
message Hello { string node_id = 1; uint32 protocol_version = 2; string capabilities_digest = 3; uint32 node_control_version = 4; uint32 execution_control_version = 5; uint32 rejection_receipts_version = 6; uint32 input_artifacts_version = 7; uint32 renewal_version = 8; }
// Protocol v1 control-session TTL is 45 seconds; it is not an execution lease.
message Welcome { string session_id = 1; uint64 connection_epoch = 2; uint32 protocol_version = 3; google.protobuf.Timestamp expires_at = 4; uint32 node_control_version = 5; uint64 node_policy_generation = 6; uint32 execution_control_version = 7; uint32 rejection_receipts_version = 8; uint32 input_artifacts_version = 9; uint32 renewal_version = 10; }
// Execution capability1 is independent of node-control capability. Zero/old
// clients never receive assignments. Version1 grants are immutable, <=45s,
// ACK within10s, and do not imply renew/resume/result/cleanup support.
// Capability2 additionally requires immutable first-ACK start_budget_ms and a
// receiver retaining that exact send's monotonic anchor. Node policy uses v2.
message Assignment {
  string command_id = 1; string payload_digest = 2; Lease lease = 3;
  string model_version_id = 4; string execution_profile_id = 5;
  string request_projection_digest = 6; repeated string input_artifact_ids = 7;
  google.protobuf.Timestamp job_deadline = 8;
  string node_id = 9; string session_id = 10; uint64 node_policy_generation = 11;
  string model_sha256 = 12; string execution_profile_digest = 13;
  repeated InputArtifact input_artifacts = 14;
}
enum AckResult { ACK_UNSPECIFIED = 0; ACCEPTED = 1; RESOURCE_REJECTED = 2; PROTOCOL_REJECTED = 3; }
message Acknowledge {
  string command_id = 1; string payload_digest = 2; Lease lease = 3;
  AckResult result = 4; string execution_journal_id = 5;
  string broker_grant_id = 6; uint64 broker_epoch = 7; uint64 slot_generation = 8;
}
// An ACK is not a start permission; both cloud grant and local ConfirmStart are required.
message StartGrant { string command_id = 1; Lease lease = 2; string payload_digest = 3;
  string execution_journal_id = 4; string broker_grant_id = 5;
  uint64 broker_epoch = 6; uint64 slot_generation = 7;
  // Immutable budget from FIRST accepted ACK. Anchor to its original monotonic
  // send, subtract a safety margin, never reset on replay/reconnect. Capability2.
  uint64 start_budget_ms = 8; }
// Optional independently negotiated rejection_receipts_version1. These are
// durable negative-decision receipts, never start/cleanup/payment permissions.
message RejectionReceipt {
  string command_id = 1; string payload_digest = 2; Lease lease = 3;
  AckResult result = 4; string receipt_id = 5;
}
// Read-only recovery by original negative ACK under a CURRENT device session.
// The original Lease/epoch is historical evidence, not renewed authority.
message RejectionQuery { Acknowledge rejected = 1; }
message Renew { Lease lease = 1; string supervisor_instance_id = 2; }
message ResumeRequest { Lease previous_lease = 1; string execution_journal_id = 2; string supervisor_instance_id = 3; }
message ResumeGrant { Lease lease = 1; string execution_journal_id = 2; }
message Cancel { string command_id = 1; Lease lease = 2; string reason_code = 3; }
message OutputChunk { Lease lease = 1; uint64 sequence = 2; bytes utf8_data = 3; string cumulative_digest = 4; }
message Usage {
  string invocation_id = 1; string segment_id = 2;
  enum Mode { MODE_UNSPECIFIED = 0; DELTA = 1; CUMULATIVE = 2; }
  Mode mode = 3; uint64 input_tokens = 4; uint64 output_tokens = 5;
  uint64 audio_milliseconds = 6; uint32 image_count = 7;
}
message Completion { Lease lease = 1; repeated string output_artifact_ids = 2; string output_digest = 3; Usage usage = 4; string termination_reason = 5; }
message CleanupReport {
  Lease lease = 1; string broker_grant_id = 2; uint64 broker_epoch = 3; uint64 slot_generation = 4;
  bool tasks_joined = 5; bool processes_exited = 6; bool device_probe_available = 7;
  bool device_healthy = 8; string supervisor_instance_id = 9; string evidence_digest = 10;
}
message Heartbeat { string node_id = 1; uint64 connection_epoch = 2; string capability_snapshot_id = 3; }
// Control-session liveness only. This does not renew any execution lease.
message HeartbeatAck { string node_id = 1; uint64 connection_epoch = 2; string session_id = 3; google.protobuf.Timestamp expires_at = 4; uint64 node_policy_generation = 5; }
message ProtocolError { string code = 1; string request_id = 2; bool retry_same_command = 3; }
// Optional capability, explicitly negotiated as node_control_version=1. Old
// clients offering0 never receive these frames. No node resume or GPU release.
// Version2 additionally binds policy application to the authoritative generation
// in Welcome/HeartbeatAck. Version1 receivers cannot authorize local application.
enum NodeStopKind { NODE_STOP_KIND_UNSPECIFIED = 0; NODE_STOP_KIND_DRAIN = 1; NODE_STOP_KIND_QUARANTINE = 2; }
message NodeCommand {
  string command_id = 1; string action_id = 2; string node_id = 3;
  uint64 policy_generation = 4; NodeStopKind kind = 5; string payload_digest = 6;
  string session_id = 7; uint64 connection_epoch = 8;
}
// Only emitted after local WAL/FULL commit. This is RECEIVED, not APPLIED or
// CLEANED. It cannot release a resource or make an Admin action succeeded.
message NodeReceipt {
  string command_id = 1; string node_id = 2; uint64 policy_generation = 3;
  string payload_digest = 4; string receipt_id = 5;
  string session_id = 6; uint64 connection_epoch = 7;
}
message WorkerFrame {
  oneof body { Hello hello = 1; Acknowledge acknowledge = 2; Renew renew = 3;
    ResumeRequest resume = 4; OutputChunk output = 5; Completion completion = 6;
    CleanupReport cleanup = 7; Heartbeat heartbeat = 8; NodeReceipt node_receipt = 9; RejectionQuery rejection_query = 10; }
}
message ServerFrame {
  oneof body { Welcome welcome = 1; Assignment assignment = 2; StartGrant start = 3;
    Lease renewed = 4; ResumeGrant resume = 5; Cancel cancel = 6; ProtocolError error = 7; HeartbeatAck heartbeat = 8; NodeCommand node_command = 9; RejectionReceipt rejection_receipt = 10; }
}

// Optional input_artifacts_version1 transports a bound GenerateRequest JSON.
// Separate unary chunks let the control stream remain available for liveness.
message InputArtifact { string artifact_id=1; string version_id=2; string sha256=3; uint64 size_bytes=4; string media_type=5; }
message InputReadRequest { string session_id=1; Lease lease=2; string artifact_id=3; string version_id=4; uint64 offset=5; uint32 max_bytes=6; }
message InputReadReply { InputArtifact artifact=1; uint64 offset=2; bytes data=3; bool eof=4; }

// Independently negotiated renewal_version1. Original Assignment/Lease remains
// immutable. Never interpret the legacy Renew/renewed stream draft as permission.
message ExecutionRenewalRequest {
 string session_id=1; string request_id=2; uint64 sequence=3;
 Acknowledge accepted=4; string supervisor_instance_id=5;
}
// Budget belongs to FIRST request receipt; client anchors to original send,
// subtracts one second, and never recreates that anchor after restart/replay.
message ExecutionRenewalReply {
 string request_id=1; uint64 sequence=2; string request_digest=3;
 uint64 budget_ms=4; google.protobuf.Timestamp expires_at=5;
}
