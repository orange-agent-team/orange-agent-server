[package]
name = "orange-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Explicit integration-test scheduling; absent from production/default builds.
test-control-gates = []

[dependencies]
orange-domain.workspace = true
orange-protocol = { workspace = true, features = ["grpc"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
libc.workspace = true
tonic.workspace = true
prost.workspace = true
tokio-stream.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[target.'cfg(unix)'.dependencies]
orange-model-runtime.workspace = true
pkcs8 = { version = "=0.11.0", features = ["alloc"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
prost-types.workspace = true
tempfile.workspace = true

[lints]
workspace = true
