[package]
name = "orange-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
integration-tests = []
cloud-host-tests = ["integration-tests"]
pg-view-tests = []
repository-live-tests = []
repository-fixture-tests = ["integration-tests"]
notion-fixture-tests = ["integration-tests"]
s3-source-tests = []
cloud-upgrade-tests = ["integration-tests"]
real-worker-tests = ["integration-tests", "orange-worker/test-control-gates"]
web-compute-tests = ["real-worker-tests"]
queue-expiry-tests = ["integration-tests"]

[[test]]
name = "s3_source"
required-features = ["s3-source-tests"]

[[test]]
name="repo_sources"
required-features=["repository-live-tests"]

[[test]]
name = "pg_views"
required-features = ["pg-view-tests"]

[[test]]
name = "postgres"
required-features = ["integration-tests"]

[[test]]
name = "admin_audit"
required-features = ["integration-tests"]

[[test]]
name = "admin_identity"
required-features = ["integration-tests"]

[[test]]
name = "admin_actions"
required-features = ["integration-tests"]

[[test]]
name = "teams"
required-features = ["integration-tests"]

[[test]]
name = "events"
required-features = ["integration-tests"]

[[test]]
name = "queue"
required-features = ["integration-tests"]

[[test]]
name = "user_identity"
required-features = ["integration-tests"]

[[test]]
name = "worker_sessions"
required-features = ["integration-tests"]

[dependencies]
orange-agent-runtime = { path = "../../crates/agent-runtime", version = "=0.1.0" }
orange-model-runtime.workspace = true
orange-domain.workspace = true
orange-protocol = { workspace = true, features = ["grpc"] }
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
uuid.workspace = true
openidconnect.workspace = true
sha2.workspace = true
hmac = "=0.13.0"
sha1 = "=0.11.0"
httpdate = "=1.0.3"
hex.workspace = true
time.workspace = true
base64.workspace = true
thiserror.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
prost-types.workspace = true
prost.workspace = true
percent-encoding = "=2.3.2"
reqwest.workspace = true
opendal = { workspace = true, features = ["services-s3"] }
libc.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
orange-model-runtime.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
tower.workspace = true
orange-worker = { path = "../worker", version = "=0.1.0" }

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true

[[test]]
name = "cloud_turn_upgrade"
path = "tests/cloud_turn_upgrade.rs"
required-features = ["cloud-upgrade-tests"]
