[project]
name = "orange-sdxl-macos-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.16.0",
    "diffusers==0.43.0",
    "invisible-watermark==0.2.0",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "safetensors==0.8.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.23.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
